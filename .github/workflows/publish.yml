on:
  push:
    tags:
      - "v*"

name: Publish

permissions:
  contents: read

jobs:

  preflight:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches workspace version
        run: |
          version="$(sed -nE 's/^version = "([0-9.]+)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

  build_and_test:
    name: Build and test (${{ matrix.crate }})
    needs: preflight
    runs-on: ubuntu-latest
    # The morphology suite generates the paradigm of every 22³ root, so keep
    # this matrix job independently bounded from the database workflow.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate:
          - haqor-admin
          - haqor-cli
          - haqor-core
          - haqor-db-gen
          - haqor-morphology
          - haqor-sync-server
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the lexicon source
        # haqor-db-gen's lexicon_roots test builds BDB from
        # src_texts/HebrewLexicon, which is a submodule — without it the test
        # fails on a bare "No such file or directory", and a tag then cannot
        # publish at all. Only that submodule: morphhb is 94 MB and nothing in
        # this job reads it. Kept in step with the same fetch in `ci.yml`.
        run: git submodule update --init --depth 1 src_texts/HebrewLexicon
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: haqor-core-${{ matrix.crate }}
          workspaces: . -> target
          cache-bin: false
      - name: Build
        run: cargo build --package "${{ matrix.crate }}" --all-features
      - name: Test
        run: cargo test --package "${{ matrix.crate }}" --all-features

  crates_io_publish:
    name: Publish (crates.io)
    needs:
      - build_and_test
      - preflight

    environment: cargo

    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo-release cache restore
        id: cargo_release_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-release
          key: ${{ runner.os }}-cargo-release

      - run: cargo install cargo-release
        if: steps.cargo_release_cache_restore.outputs.cache-hit != 'true'

      - name: cargo-release cache save
        id: cargo_release_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.cargo_release_cache_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/cargo-release
          key: ${{ runner.os }}-cargo-release

      - name: cargo login
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          echo "$CRATES_IO_API_TOKEN" | cargo login

      - name: "cargo release publish"
        run: |
          cargo release \
            publish \
            --workspace \
            --all-features \
            --allow-branch HEAD \
            --no-confirm \
            --no-verify \
            --execute

  runtime_database:
    name: Runtime database
    needs: [preflight, build_and_test]
    uses: ./.github/workflows/runtime-database.yml
    with:
      core-sha: ${{ github.sha }}
      blob-codec: zstd
      upload-release: true

  github_release:
    name: Attach runtime database release assets
    needs: [crates_io_publish, runtime_database]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated runtime database
        uses: actions/download-artifact@v4
        with:
          name: core-runtime-database
          path: dist
      - name: Attach runtime database to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
