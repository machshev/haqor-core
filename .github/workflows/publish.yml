on:
  push:
    tags:
      - "*"

name: Publish

jobs:

  build_and_test:
    name: Build and test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    # haqor-core's suite takes ~31 minutes on its own: the reverse-index test
    # generates the paradigm of every 22³ root.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate:
          - haqor-admin
          - haqor-cli
          - haqor-core
          - haqor-db-gen
          - haqor-morphology
          - haqor-sync-server
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the lexicon source
        # haqor-db-gen's lexicon_roots test builds BDB from
        # src_texts/HebrewLexicon, which is a submodule — without it the test
        # fails on a bare "No such file or directory", and a tag then cannot
        # publish at all. Only that submodule: morphhb is 94 MB and nothing in
        # this job reads it. Kept in step with the same fetch in `ci.yml`.
        run: git submodule update --init --depth 1 src_texts/HebrewLexicon
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --package "${{ matrix.crate }}" --all-features
      - name: Test
        run: cargo test --package "${{ matrix.crate }}" --all-features

  crates_io_publish:
    name: Publish (crates.io)
    needs:
      - build_and_test

    environment: cargo

    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo-release cache restore
        id: cargo_release_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-release
          key: ${{ runner.os }}-cargo-release

      - run: cargo install cargo-release
        if: steps.cargo_release_cache_restore.outputs.cache-hit != 'true'

      - name: cargo-release cache save
        id: cargo_release_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.cargo_release_cache_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/cargo-release
          key: ${{ runner.os }}-cargo-release

      - name: cargo login
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          echo "$CRATES_IO_API_TOKEN" | cargo login

      - name: "cargo release publish"
        run: |
          cargo release \
            publish \
            --workspace \
            --all-features \
            --allow-branch HEAD \
            --no-confirm \
            --no-verify \
            --execute
