name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - run: cargo fmt --all -- --check

  docs_and_spell_check:
    name: Docs and Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-Dwarnings"
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo doc --no-deps --document-private-items

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: clippy

      - name: "Run clippy"
        # we cannot use `--all-features` because `envman` has features that are mutually exclusive.
        run: |
          cargo clippy

  changed_crates:
    name: Find changed crates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: matrix
        name: Build test matrix
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.sha }}"

          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            # A branch's first push has no parent revision to compare, so test
            # every crate rather than accidentally skipping its test suite.
            changed_files="$(git ls-tree -r --name-only "$head")"
          else
            changed_files="$(git diff --name-only "$base" "$head")"
          fi

          crates=(
            haqor-admin
            haqor-cli
            haqor-core
            haqor-db-gen
            haqor-morphology
            haqor-sync-server
          )
          selected=()

          # Root manifests and toolchain/CI configuration can affect every
          # package. Run the complete matrix whenever any of them changes.
          if grep -Eq '^(Cargo\.(toml|lock)|\.cargo/|rust-toolchain|\.github/workflows/ci\.yml$)' <<<"$changed_files"; then
            selected=("${crates[@]}")
          else
            for crate in "${crates[@]}"; do
              if grep -Fq "crates/$crate/" <<<"$changed_files"; then
                selected+=("$crate")
              fi
            done
          fi

          matrix="$(printf '%s\n' "${selected[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | map({crate: .}) | {include: .}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_changes=$([[ ${#selected[@]} -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build_and_test:
    name: Build and test (${{ matrix.crate }})
    needs: changed_crates
    if: needs.changed_crates.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # haqor-core's suite takes ~31 minutes: the reverse-index test generates
    # the paradigm of every 22³ root, which is why [profile.test] optimises.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed_crates.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - name: Fetch the lexicon source
        # haqor-db-gen's lexicon_roots test builds BDB from
        # src_texts/HebrewLexicon, which is a submodule — without it the test
        # fails on a bare "No such file or directory". Only that submodule:
        # morphhb is 94 MB and nothing in this job reads it.
        run: git submodule update --init --depth 1 src_texts/HebrewLexicon
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --package "${{ matrix.crate }}" --all-features
      - name: Test
        # Tests needing data/*.db skip here — the databases are gitignored and
        # too expensive to build per matrix entry. The runtime_db job below
        # generates them once and runs those tests for real.
        run: cargo test --package "${{ matrix.crate }}" --all-features

  runtime_db:
    name: Runtime database
    needs: changed_crates
    # The differential tests are the only thing standing behind gen-runtime's
    # precomputed word info, and they need the generation databases — an hour
    # of work, so this runs only when the data pipeline or the resolution it
    # copies could have changed.
    if: >
      contains(needs.changed_crates.outputs.matrix, 'haqor-db-gen') ||
      contains(needs.changed_crates.outputs.matrix, 'haqor-core') ||
      contains(needs.changed_crates.outputs.matrix, 'haqor-morphology')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-dbgen-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-dbgen-${{ runner.os }}-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-dbgen-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Add swap space
        # gen-hebrew's reverse-parse index peaks at ~19 GB RSS (measured), just
        # over the 16 GB on standard runners — without extra swap the VM's OOM
        # killer takes down the runner agent. /mnt is the large ephemeral disk.
        run: |
          sudo fallocate -l 16G /mnt/swapfile-dbgen
          sudo chmod 600 /mnt/swapfile-dbgen
          sudo mkswap /mnt/swapfile-dbgen
          sudo swapon /mnt/swapfile-dbgen
          free -h

      - name: Generate the databases
        env:
          RUST_LOG: info
        # `cargo run` from the checkout, not the nix-built binary: gen-lexicon
        # locates data/lexicon_overrides.json through a compile-time
        # CARGO_MANIFEST_DIR path, which in a `nix build` binary points at the
        # vanished build sandbox.
        run: |
          ./scripts/fetch-stepbible-data.sh
          nix develop --command bash -c '
            set -euo pipefail
            cargo run --release -p haqor-cli -- db gen-bible
            cargo run --release -p haqor-cli -- db gen-lexicon
            cargo run --release -p haqor-cli -- db gen-hebrew --force
            cargo run --release -p haqor-cli -- db gen-sedra
            cargo run --release -p haqor-cli -- db gen-runtime
          '

      - name: Check the precomputed data against live resolution
        # HAQOR_REQUIRE_DATA turns the "no databases, skipping" path into a
        # failure: a green run that quietly tested nothing is the failure mode
        # worth guarding against here.
        env:
          HAQOR_REQUIRE_DATA: "1"
        # `name_roots` runs here too: it reads the built `haqor.db` — which is
        # why the step above generates it, rather than leaving it to the size
        # report below — since in the matrix job it can only skip, and a guard
        # that never runs guards nothing.
        run: >
          nix develop --command
          cargo test -p haqor-db-gen --test runtime_db --test name_roots

      - name: Build and read back the shipping form
        # Releases ship `--blob-codec zstd` while every local build and test
        # defaults to `none`, so the compressed read path used to reach an app
        # release without anything having read a compressed blob — and one
        # shipped that could not decode a single verse. Read the compressed
        # database back through the CLI, which is the same `Bible` the app
        # opens, before reporting on it.
        run: |
          set -euo pipefail
          nix develop --command bash -c \
            'cargo run --release -p haqor-cli -- db gen-runtime --blob-codec zstd'
          verse="$(nix develop --command bash -c \
            'cargo run --release --quiet -p haqor-cli -- get 1 1 1')"
          test -n "$verse" || { echo "::error::Genesis 1:1 read back empty"; exit 1; }
          echo "Genesis 1:1 from the compressed build: $verse"
          size="$(du -h data/haqor.db | cut -f1)"
          echo "haqor.db (zstd): $size" >> "$GITHUB_STEP_SUMMARY"
          echo "Genesis 1:1: $verse" >> "$GITHUB_STEP_SUMMARY"
          sqlite3 data/haqor.db "SELECT key || ' = ' || value FROM meta;" \
            >> "$GITHUB_STEP_SUMMARY"
