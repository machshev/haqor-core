[workspace]
members = [
    "crates/haqor-admin",
    "crates/haqor-cli",
    "crates/haqor-core",
    "crates/haqor-db-gen",
    "crates/haqor-morphology",
    "crates/haqor-sync-server",
]
default-members = ["crates/haqor-cli"]
resolver = "3"

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/machshev/haqor-core"

# Tests exercise the morphology generator heavily (the reverse-index test
# generates the paradigm of every 22³ root); unoptimized they are unusably
# slow, so optimize test builds.
[profile.test]
opt-level = 3
