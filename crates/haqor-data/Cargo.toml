[package]
name = "haqor-data"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Generated database pipeline for Haqor"
repository = "https://github.com/machshev/haqor-core"

[dependencies]
anyhow = "1.0.81"
csv = "1.3"
haqor-morphology = { path = "../haqor-morphology" }
haqor-runtime = { path = "../haqor-runtime" }
log = "0.4.22"
quick-xml = "0.37"
rayon = "1.12.0"
rusqlite = { version = "0.37.0", features = ["bundled", "functions"] }
serde_json = "1.0"
