[package]
name = "haqor-sync-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LAN learner-progress sync server for Haqor"
repository.workspace = true

[dependencies]
anyhow = "1.0.81"
clap = { version = "4.5.42", features = ["derive"] }
getrandom = "0.3.4"
haqor-core = { path = "../haqor-core", version = "0.9.17" }
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
