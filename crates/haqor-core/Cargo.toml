[package]
name = "haqor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bible access and Hebrew learning core for Haqor"
repository.workspace = true

[features]
default = []
embedded = ["dep:rust-embed", "rusqlite/serialize"]

[dependencies]
anyhow = "1.0.81"
haqor-morphology = { path = "../haqor-morphology" }
log = "0.4.22"
rusqlite = { version = "0.37.0", features = ["bundled", "functions"] }
rust-embed = { version = "8.7.2", features = ["debug-embed"], optional = true }
serde_json = "1.0"

[dev-dependencies]
env_logger = "0.11.5"
