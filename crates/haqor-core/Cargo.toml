[package]
name = "haqor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bible access and Hebrew learning core for Haqor"
repository.workspace = true

[features]
default = []
embedded = ["dep:rust-embed"]

[dependencies]
anyhow = "1.0.81"
haqor-morphology = { path = "../haqor-morphology", version = "0.7.8" }
log = "0.4.22"
# `ffi-sqlite-wasm-rs` is enabled by rusqlite's default features and swaps the
# native bundled SQLite C build for the browser SQLite WASM bridge on
# wasm32-unknown-unknown. Native targets continue using the bundled build.
rusqlite = { version = "0.39.0", features = ["bundled", "functions", "serialize"] }
rust-embed = { version = "8.7.2", features = ["debug-embed"], optional = true }
ruzstd = "0.9"
serde_json = "1.0"

[dev-dependencies]
env_logger = "0.11.5"
# The C library the generator compresses blobs with. Tests only: the read path
# stays on pure-Rust `ruzstd` so this crate keeps building for wasm.
zstd = "0.13"
